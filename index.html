<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0A0F0A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="description" content="NextGen TV — FIFA World Cup 2026 Live Sports Streaming"/>
<title>NextGen TV — FIFA World Cup 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0F0A;--s1:#141914;--s2:#1C2420;--s3:#242E29;
  --green:#16A34A;--green-bright:#22C55E;--gg:rgba(34,197,94,0.13);--gb:rgba(34,197,94,0.28);
  --gold:#FBBF24;--gold-glow:rgba(251,191,36,0.14);
  --red:#EF4444;--white:#F8FAFC;--grey:#94A3B8;--muted:#64748B;
  --fd:'Outfit',sans-serif;--fb:'Inter',sans-serif;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;
}
html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
img{-webkit-user-drag:none;user-select:none}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fillBar{to{width:100%}}
@keyframes pulseTag{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes floodlight1{from{transform:translate(0,0) scale(1);opacity:.8}to{transform:translate(5%,8%) scale(1.15);opacity:1}}
@keyframes floodlight2{from{transform:translate(0,0) scale(1);opacity:.6}to{transform:translate(-6%,6%) scale(1.1);opacity:.9}}
@keyframes floodlight3{from{transform:scale(1);opacity:.5}to{transform:scale(1.2);opacity:.8}}
@keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ══ SPLASH ══ */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.sp-logo{width:90px;height:90px;object-fit:contain;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
.sp-title{font-family:var(--fd);font-size:27px;font-weight:800;letter-spacing:-.5px;animation:fadeUp .5s .3s both}
.sp-title b{color:var(--green-bright)}
.sp-by{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:2px;text-transform:uppercase;animation:fadeUp .5s .45s both}
.sp-bar{width:130px;height:2px;background:var(--s2);border-radius:2px;overflow:hidden;margin-top:6px;animation:fadeUp .4s .55s both}
.sp-fill{height:100%;background:var(--green-bright);width:0;animation:fillBar 1.8s .65s ease forwards}

/* ══ SCREENS ══ */
.screen{position:fixed;inset:0;display:none;overflow:hidden}
#homeScreen.active{display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;animation:screenIn .35s cubic-bezier(.22,1,.36,1) both}
#playerScreen.active{display:flex;flex-direction:column;overflow:hidden;animation:screenIn .35s cubic-bezier(.22,1,.36,1) both}
#scheduleScreen.active{display:flex;flex-direction:column;overflow:hidden;animation:screenIn .35s cubic-bezier(.22,1,.36,1) both}
#playerScreen .pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overflow-x:hidden}

/* ══ TOPBAR ══ */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(10,15,10,.92);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.05)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{width:36px;height:36px;object-fit:contain;border-radius:9px}
.topbar-name{font-family:var(--fd);font-size:15px;font-weight:700;line-height:1;letter-spacing:-.2px}
.topbar-by{font-size:8px;font-weight:400;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.topbar-live{display:flex;align-items:center;gap:6px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);padding:5px 12px;border-radius:var(--r-pill)}
.live-dot{width:6px;height:6px;background:var(--red);border-radius:50%;animation:blink 1.3s ease infinite}
.topbar-live-text{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--red);text-transform:uppercase}
/* ══ FIFA 2026 BANNER (4:5 ratio) — Trophy Showcase ══ */
.banner{
  position:relative;width:100%;aspect-ratio:4/5;max-height:78vh;overflow:hidden;
  border-radius:0 0 28px 28px;
  background:
    radial-gradient(ellipse 90% 50% at 80% 100%, #0B3D1E 0%, transparent 60%),
    radial-gradient(ellipse 140% 70% at 30% -10%, #0E2A4A 0%, transparent 55%),
    linear-gradient(180deg, #050A14 0%, #060F0A 38%, #04140A 70%, #020805 100%);
  display:flex;flex-direction:column;justify-content:flex-end;
}

/* Stadium crowd-stand silhouette + floodlight masts */
.banner-stadium{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}

/* Floodlight glows */
.banner-glow{position:absolute;border-radius:50%;pointer-events:none;filter:blur(55px);mix-blend-mode:screen}
.banner-glow-1{width:85%;height:55%;top:-22%;left:-20%;background:radial-gradient(circle,rgba(34,197,94,.5) 0%,rgba(34,197,94,.08) 45%,transparent 75%);animation:floodlight1 9s ease-in-out infinite alternate}
.banner-glow-2{width:75%;height:50%;top:-20%;right:-22%;background:radial-gradient(circle,rgba(251,191,36,.45) 0%,rgba(251,191,36,.08) 45%,transparent 75%);animation:floodlight2 11s ease-in-out infinite alternate}
.banner-glow-3{width:60%;height:38%;top:18%;left:22%;background:radial-gradient(circle,rgba(56,189,248,.22) 0%,transparent 70%);animation:floodlight3 13s ease-in-out infinite alternate}
.banner-glow-4{width:90%;height:30%;bottom:-8%;left:5%;background:radial-gradient(ellipse,rgba(34,197,94,.28) 0%,transparent 70%);filter:blur(70px)}

/* Light beam shafts */
.banner-beam{position:absolute;top:-5%;width:2px;height:60%;pointer-events:none;mix-blend-mode:screen;transform-origin:top center;filter:blur(2px)}
.banner-beam-1{left:18%;background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(34,197,94,.1) 40%,transparent 100%);transform:rotate(8deg) scaleX(40);opacity:.5;animation:beamFlicker 6s ease-in-out infinite}
.banner-beam-2{right:22%;background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,rgba(251,191,36,.1) 40%,transparent 100%);transform:rotate(-10deg) scaleX(45);opacity:.4;animation:beamFlicker 7.5s ease-in-out infinite reverse}
.banner-beam-3{left:48%;background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(56,189,248,.08) 45%,transparent 100%);transform:rotate(2deg) scaleX(55);opacity:.35;animation:beamFlicker 9s ease-in-out infinite}
@keyframes beamFlicker{0%,100%{opacity:.25}50%{opacity:.5}}

/* Pitch markings */
.banner-pitch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
.banner-vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 32%,rgba(2,8,5,.45) 68%,rgba(2,8,5,.92) 100%)}

/* ── Trophy showcase (right side) ── */
.banner-trophy-wrap{position:absolute;right:-4%;top:6%;width:62%;height:62%;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
.banner-trophy-glow{position:absolute;width:80%;height:80%;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.45) 0%,rgba(251,191,36,.12) 40%,transparent 75%);filter:blur(30px);animation:trophyPulse 4s ease-in-out infinite}
@keyframes trophyPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.banner-trophy{position:relative;width:78%;filter:drop-shadow(0 12px 40px rgba(251,191,36,.35));animation:trophyFloat 6s ease-in-out infinite}
@keyframes trophyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Ball */
.banner-match-ball{position:absolute;right:4%;bottom:12%;width:23%;z-index:2;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));animation:ballSpin 18s linear infinite}
@keyframes ballSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Confetti */
.banner-confetti{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:14px;opacity:.85;animation:confettiFall linear infinite}
@keyframes confettiFall{0%{transform:translateY(-10%) rotate(0deg);opacity:0}10%{opacity:.9}100%{transform:translateY(120%) rotate(540deg);opacity:0}}

/* Watermark ball (kept subtle, behind content) */
.banner-ball{position:absolute;top:6%;right:-8%;font-size:230px;opacity:.04;transform:rotate(18deg);pointer-events:none;filter:blur(1px)}

/* ── Content ── */
.banner-content{position:relative;z-index:3;padding:0 20px}
.banner-eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;opacity:0;animation:fadeUp .5s .05s both;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.banner-eyebrow-flags{display:flex;gap:4px;margin-right:4px}
.banner-eyebrow-flag{font-size:15px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.banner-title{font-family:var(--fd);font-weight:800;font-size:40px;line-height:1.02;letter-spacing:-1px;color:var(--white);margin-bottom:16px;display:flex;flex-direction:column;opacity:0;animation:fadeUp .6s .13s both;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.banner-title-top{text-transform:uppercase;font-size:0.62em;letter-spacing:1px}
.banner-title-year{font-size:64px;font-weight:800;background:linear-gradient(135deg,var(--green-bright) 0%,var(--gold) 55%,#FDE68A 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-2px;line-height:1;margin-top:2px;filter:drop-shadow(0 2px 16px rgba(251,191,36,.35))}
.banner-divider{width:64px;height:3px;background:linear-gradient(90deg,var(--green-bright),var(--gold));border-radius:2px;margin:12px 0 10px;opacity:0;animation:fadeUp .6s .18s both}
.banner-dates{font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:20px;opacity:0;animation:fadeUp .6s .21s both;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.banner-stats{display:flex;align-items:center;gap:14px;margin-bottom:20px;opacity:0;animation:fadeUp .6s .26s both;flex-wrap:wrap}
.banner-stat{display:flex;align-items:center;gap:7px}
.banner-stat-icon{font-size:16px;color:var(--green-bright);filter:drop-shadow(0 0 6px rgba(34,197,94,.4))}
.banner-stat-text{display:flex;flex-direction:column;gap:0}
.banner-stat-value{font-family:var(--fd);font-size:17px;font-weight:700;color:var(--white);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.banner-stat-label{font-size:8px;font-weight:600;color:var(--grey);letter-spacing:1.5px;text-transform:uppercase}
.banner-stat-divider{width:1px;height:22px;background:rgba(255,255,255,.14)}
.banner-overlay-slot{margin:0 -20px;padding-bottom:18px;opacity:0;animation:fadeUp .6s .33s both}

@media(max-width:380px){
  .banner-title{font-size:32px}
  .banner-title-year{font-size:50px}
  .banner-trophy-wrap{width:58%;right:-8%}
  .banner-match-ball{width:24%}
}
@media(min-width:600px){.banner{aspect-ratio:4/3.6}}

/* ══ MATCH CARDS (glass overlay) ══ */
.mc-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 20px;-webkit-overflow-scrolling:touch}
.mc{
  flex:0 0 auto;width:196px;background:rgba(20,30,24,.55);
  backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;
  cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.35);
  opacity:0;animation:slideInRight .45s cubic-bezier(.22,1,.36,1) both;
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s;
  will-change:transform;
}
.mc:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 36px rgba(0,0,0,.45)}
.mc:active{transform:scale(.98)}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mc-time{font-size:9px;font-weight:600;letter-spacing:1.5px;color:var(--green-bright);text-transform:uppercase;display:flex;align-items:center;gap:5px}
.mc-live-pulse{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1s ease infinite}
.mc-comp-emblem{width:16px;height:16px;object-fit:contain;opacity:.85}
.mc-teams{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.mc-crest{object-fit:contain;width:28px;height:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.mc-flag{line-height:1;font-size:22px}
.mc-team-name{font-size:10.5px;font-weight:600;color:var(--white);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.mc-center{display:flex;align-items:center;justify-content:center;min-width:38px;flex-shrink:0}
.mc-vs{font-size:11px;font-weight:700;color:var(--muted)}
.mc-score{font-family:var(--fd);font-size:17px;font-weight:700;color:var(--white);letter-spacing:.5px}
.mc-countdown{margin-top:10px;padding:7px 8px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.22);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.cd-block{display:flex;flex-direction:column;align-items:center;gap:0}
.cd-num{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.cd-lbl{font-size:7px;color:rgba(251,191,36,.55);letter-spacing:1px}
.cd-sep{font-size:12px;font-weight:700;color:rgba(251,191,36,.35);margin-top:-4px}
.mc-bottom{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.mc-comp-name{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.mc-tag{font-size:8px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.mc-tag-live{color:var(--red);background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.25);animation:pulseTag 1.8s ease infinite}
.mc-tag-soon{color:var(--gold);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.25)}
.mc-tag-up{color:var(--green-bright);background:var(--gg);border:1px solid var(--gb)}
.mc-tag-fin{color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.mc-hint{position:absolute;bottom:0;left:0;right:0;padding:7px;text-align:center;font-size:9px;font-weight:600;letter-spacing:.8px;color:var(--green-bright);background:linear-gradient(0deg,rgba(34,197,94,.16) 0%,transparent 100%);opacity:0;transition:opacity .2s;pointer-events:none}
.mc:hover .mc-hint{opacity:1}
.mc-empty{display:flex;align-items:center;gap:10px;padding:16px 20px;color:var(--muted);font-size:12px;letter-spacing:.5px}
.mc-empty-icon{font-size:18px;opacity:.5}
/* ══ SECTION HEADER ══ */
.sh{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 12px}
.sh-t{font-family:var(--fd);font-size:15px;font-weight:700;letter-spacing:-.2px}
.sh-m{font-size:11px;font-weight:600;color:var(--green-bright)}

/* ══ CATEGORY TABS ══ */
.cat-tabs{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cat-tab{position:relative;flex:0 0 auto;padding:7px 16px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.08);background:transparent;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.4px;white-space:nowrap;transition:color .2s,border-color .2s,background .25s cubic-bezier(.22,1,.36,1);overflow:hidden}
.cat-tab:hover{color:var(--white);border-color:rgba(255,255,255,.18)}
.cat-tab.on{color:var(--green-bright);border-color:var(--green);background:var(--gg)}

/* ══ CHANNEL GRID — Apple style ══ */
.ch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 110px}
@media(min-width:480px){.ch-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:700px){.ch-grid{grid-template-columns:repeat(5,1fr)}}

.ch-card{
  background:var(--s2);border:1px solid rgba(255,255,255,.06);border-radius:var(--r-md);
  display:flex;flex-direction:column;align-items:center;padding:16px 10px 12px;gap:8px;
  position:relative;overflow:hidden;width:100%;-webkit-tap-highlight-color:transparent;
  will-change:transform;cursor:pointer;
  opacity:0;animation:fadeUp .35s cubic-bezier(.22,1,.36,1) both;
  transition:transform .18s cubic-bezier(.22,1,.36,1),background .18s,border-color .18s,box-shadow .18s;
}
.ch-card:hover{background:var(--s3);border-color:rgba(255,255,255,.12);box-shadow:0 10px 28px rgba(0,0,0,.4);transform:translateY(-4px) scale(1.03)}
.ch-card:active{transform:scale(.96)}
.ch-card.on-playing{border-color:var(--green);background:var(--gg)}
.ch-card-logo{width:50px;height:50px;border-radius:12px;overflow:hidden;background:var(--s3);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.07);position:relative;flex-shrink:0}
.ch-card-logo img{width:100%;height:100%;object-fit:contain}
.ch-card-icon{font-size:22px;line-height:1}
.ch-card-dot{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--s2);animation:blink 1.3s ease infinite}
.ch-card-name{font-size:10.5px;font-weight:600;text-align:center;line-height:1.3;color:var(--white);width:100%;overflow:hidden;text-overflow:ellipsis}
.ch-card-q{font-size:7.5px;font-weight:700;color:var(--green-bright);background:var(--gg);border:1px solid var(--gb);padding:2px 8px;border-radius:var(--r-pill);letter-spacing:1px;text-transform:uppercase}

/* stagger delays for grid items */
.ch-card:nth-child(1){animation-delay:.00s}.ch-card:nth-child(2){animation-delay:.03s}.ch-card:nth-child(3){animation-delay:.06s}
.ch-card:nth-child(4){animation-delay:.09s}.ch-card:nth-child(5){animation-delay:.12s}.ch-card:nth-child(6){animation-delay:.15s}
.ch-card:nth-child(7){animation-delay:.18s}.ch-card:nth-child(8){animation-delay:.21s}.ch-card:nth-child(9){animation-delay:.24s}
.ch-card:nth-child(n+10){animation-delay:.27s}
/* ══ PLAYER TOPBAR ══ */
.ptop{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-shrink:0;background:rgba(10,15,10,.96);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.05)}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--white);font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;flex-shrink:0}
.back-btn:hover{background:rgba(255,255,255,.16)}
.back-btn:active{transform:scale(.9)}
.pch-info{flex:1;min-width:0}
.pch-name{font-family:var(--fd);font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.pch-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* ══ VIDEO BOX ══ */
.vbox{position:relative;background:#000;width:100%;aspect-ratio:16/9;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vbox:fullscreen,.vbox:-webkit-full-screen{aspect-ratio:unset;width:100vw;height:100vh}

/* ── CSS-rotated fullscreen (for devices without orientation lock, e.g. iOS Safari) ──
   Rotate the box 90deg around its top-left corner, then translate it so it
   exactly covers the portrait viewport as a landscape rectangle. */
.vbox.rotated-fs{
  position:fixed;
  top:0; left:0;
  z-index:99999;
  width:100vh;
  height:100vw;
  aspect-ratio:unset;
  transform: rotate(90deg) translateY(-100%);
  transform-origin: top left;
  background:#000;
}
.vbox.rotated-fs #vid,
.vbox.rotated-fs canvas#bgc{width:100%;height:100%}

/* Exit button shown only during CSS-rotated fullscreen */
.fs-exit-btn{
  position:absolute;
  z-index:100000;
  top:14px; right:14px;
  width:40px;height:40px;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.25);
  color:var(--white);
  font-size:18px;
  display:none;
  align-items:center;justify-content:center;
  transition:background .2s;
}
.fs-exit-btn.show{display:flex}
.fs-exit-btn:active{transform:scale(.92) rotate(-90deg)}
/* Counter-rotate the exit button so it stays upright and lands top-right of the visible landscape view */
.vbox.rotated-fs .fs-exit-btn{
  top:14px; right:14px;
  transform: rotate(-90deg);
  transform-origin: center;
}
.vbox.rotated-fs .fs-exit-btn:active{transform:rotate(-90deg) scale(.92)}


canvas#bgc{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);filter:blur(24px) brightness(.25) saturate(1.8);z-index:0;pointer-events:none}
#vid{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;display:block;background:transparent;transition:object-fit .15s}
#vid.fit-cover{object-fit:cover}
#vid.fit-fill{object-fit:fill}

.load-ov{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.75);transition:opacity .35s}
.load-ov.hidden{opacity:0;pointer-events:none}
.spin{width:40px;height:40px;border:2.5px solid rgba(34,197,94,.15);border-top-color:var(--green-bright);border-radius:50%;animation:spin .7s linear infinite}
.load-txt{font-size:12px;color:var(--grey);letter-spacing:1px}
.load-ch{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.5px;margin-top:-6px}
.err-ov{position:absolute;inset:0;z-index:13;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.88)}
.err-icon{font-size:36px;opacity:.4}
.err-txt{font-size:13px;color:var(--grey)}
.retry-btn{font-size:11px;font-weight:600;color:var(--green-bright);background:var(--gg);border:1px solid var(--gb);padding:9px 24px;border-radius:var(--r-pill);transition:background .2s}
.retry-btn:hover{background:rgba(34,197,94,.22)}

/* ══ CONTROLS OVERLAY ══ */
.ctrl-ov{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .25s;pointer-events:none}
.ctrl-ov.show{opacity:1;pointer-events:all}
.co-top{padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.8) 0%,transparent 100%);display:flex;align-items:center;justify-content:space-between}
.co-name{font-family:var(--fd);font-size:13px;font-weight:700}
.co-live{display:flex;align-items:center;gap:5px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);padding:3px 9px;border-radius:var(--r-pill)}
.co-live .cld{width:5px;height:5px;background:var(--red);border-radius:50%;animation:blink 1.3s ease infinite}
.co-live span{font-size:9px;font-weight:700;color:var(--red);letter-spacing:2px}
.co-mid{display:flex;align-items:center;justify-content:center;gap:28px}
.co-big{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.3);color:var(--white);font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.co-big:hover{background:rgba(255,255,255,.25);transform:scale(1.08)}
.co-big:active{transform:scale(.94)}
.co-sm{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);color:var(--white);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.co-sm:hover{background:rgba(255,255,255,.2)}
.co-sm:active{transform:scale(.92)}
.co-bot{padding:10px 14px 16px;background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,transparent 100%);display:flex;align-items:center;gap:12px}
.vol-row{display:flex;align-items:center;gap:8px;flex:1}
.vol-ic{font-size:14px;color:rgba(255,255,255,.6)}
.vol-trk{flex:1;height:3px;background:rgba(255,255,255,.15);border-radius:2px;cursor:pointer;position:relative}
.vol-fill{height:100%;background:var(--green-bright);border-radius:2px;width:85%;transition:width .1s}
.vol-thumb{position:absolute;top:50%;transform:translate(50%,-50%);right:15%;width:13px;height:13px;background:#fff;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,.5)}
.fs-btn{width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);color:var(--white);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.fs-btn:hover{background:rgba(255,255,255,.2)}
.fs-btn:active{transform:scale(.92)}
.fit-btn{width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);color:var(--white);font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-weight:700;letter-spacing:.5px}
.fit-btn:hover{background:rgba(255,255,255,.2)}
.fit-btn:active{transform:scale(.92)}
.fit-btn.active{border-color:var(--green);color:var(--green-bright);background:var(--gg)}

/* ══ PLAYER BOTTOM ══ */
.pbot{background:var(--bg);padding:14px 16px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0}
.pb-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pb-lw{width:44px;height:44px;border-radius:10px;background:var(--s2);overflow:hidden;border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pb-logo{width:100%;height:100%;object-fit:contain}
.pb-name{font-family:var(--fd);font-size:15px;font-weight:700;letter-spacing:-.2px}
.pb-meta{font-size:10px;color:var(--muted);margin-top:2px}
.pb-q{font-size:9px;font-weight:700;color:var(--green-bright);background:var(--gg);border:1px solid var(--gb);padding:3px 10px;border-radius:10px;letter-spacing:1.5px;white-space:nowrap}
.un-lbl{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.un-scroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.un-card{flex:0 0 auto;width:80px;background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 6px 7px;cursor:pointer;transition:all .18s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;align-items:center;gap:4px;-webkit-tap-highlight-color:transparent}
.un-card:hover{border-color:var(--gb);transform:translateY(-2px)}
.un-card.on{border-color:var(--green);background:var(--s2)}
.un-lw{width:32px;height:32px;border-radius:7px;background:var(--s2);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.un-logo{width:100%;height:100%;object-fit:contain}
.un-icon{font-size:15px}
.un-name{font-size:8px;font-weight:600;text-align:center;line-height:1.2;width:100%;color:var(--grey)}

/* ══ SCHEDULE SCREEN ══ */
.sched-top{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-shrink:0;background:rgba(10,15,10,.96);backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.05)}
.sched-body{flex:1;overflow-y:auto;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:22px}
.sched-teams{display:flex;align-items:center;justify-content:center;gap:18px;opacity:0;animation:fadeUp .4s .03s both}
.st-team{display:flex;flex-direction:column;align-items:center;gap:8px}
.st-crest{width:52px;height:52px;object-fit:contain;border-radius:10px}
.st-flag{font-size:42px;line-height:1}
.st-name{font-size:12px;font-weight:600}
.st-vs{font-size:20px;font-weight:700;color:var(--muted)}
.sched-date-box{background:var(--s1);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-lg);padding:18px 28px;text-align:center;min-width:220px;opacity:0;animation:fadeUp .4s .08s both}
.sdb-label{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.sdb-date{font-size:15px;font-weight:600}
.sdb-time{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--green-bright);margin-top:2px}
.sched-cd{display:flex;gap:10px;justify-content:center;opacity:0;animation:fadeUp .4s .13s both}
.scd-block{display:flex;flex-direction:column;align-items:center;background:var(--s1);border:1px solid rgba(251,191,36,.2);border-radius:var(--r-md);padding:14px 18px;min-width:68px}
.scd-num{font-family:var(--fd);font-size:28px;font-weight:700;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.scd-lbl{font-size:9px;color:rgba(251,191,36,.6);letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.sched-info{background:var(--s1);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-md);padding:14px 18px;width:100%;max-width:340px;opacity:0;animation:fadeUp .4s .18s both}
.si-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.si-row:last-child{border:none}
.si-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.si-text{font-size:11px;color:var(--grey)}
.si-val{font-size:11px;font-weight:600;margin-left:auto}
.remind-btn{display:flex;align-items:center;gap:8px;background:var(--gg);border:1px solid var(--gb);padding:13px 30px;border-radius:var(--r-pill);cursor:pointer;font-size:12px;font-weight:600;color:var(--green-bright);transition:all .2s;opacity:0;animation:fadeUp .4s .23s both}
.remind-btn:hover{background:rgba(34,197,94,.22);transform:scale(1.02)}
.remind-btn:active{transform:scale(.97)}
.remind-btn.set{background:rgba(34,197,94,.2)}

/* ══ TOAST ══ */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--s2);border:1px solid var(--gb);border-left:3px solid var(--green-bright);padding:10px 20px;border-radius:var(--r-sm);font-size:12px;font-weight:500;color:var(--white);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s cubic-bezier(.22,1,.36,1);z-index:9999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

</style>

// ── Flag emoji from country code
const FLAG=c=>{if(!c||c.length<2)return'🏳';return[...c.toUpperCase().slice(0,2)].map(x=>String.fromCodePoint(x.charCodeAt(0)+127397)).join('');};

// ── Time formatting (12-hour, English, Asia/Dhaka)
function fmtTime(u){try{return new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Dhaka'}).format(new Date(u));}catch{return'--:--';}}
function dateLong(u){try{return new Intl.DateTimeFormat('en-US',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Dhaka'}).format(new Date(u));}catch{return'';}}
function cdParts(u){let d=Math.max(0,Math.floor((new Date(u)-Date.now())/1000));const h=Math.floor(d/3600);d-=h*3600;const m=Math.floor(d/60);return{h:String(h).padStart(2,'0'),m:String(m).padStart(2,'0'),s:String(d-m*60).padStart(2,'0')};}
function within5h(u){const d=new Date(u)-Date.now();return d>0&&d<=5*3600*1000;}

// ── Team crest / flag fallback element
function teamEl(t,size){
  size=size||28;
  if(t&&t.crest){const i=document.createElement('img');i.src=t.crest;i.className='mc-crest';i.style.width=size+'px';i.style.height=size+'px';i.alt=t.name||'';i.onerror=()=>i.replaceWith(Object.assign(document.createElement('span'),{className:'mc-flag',textContent:FLAG(t.tla||''),style:`font-size:${size*0.78}px`}));return i;}
  return Object.assign(document.createElement('span'),{className:'mc-flag',textContent:FLAG(t&&t.tla||''),style:`font-size:${size*0.78}px`});
}

const cdTimers={};

function buildMatchCard(m,isToday,index){
  const live=m.status==='IN_PLAY'||m.status==='PAUSED';
  const done=m.status==='FINISHED';
  const soon=!live&&!done&&within5h(m.utcDate);
  const sh=m.score?.fullTime?.home,sa=m.score?.fullTime?.away;

  const card=document.createElement('div');
  card.className='mc';
  card.style.animationDelay=(index*0.06)+'s';
  card.dataset.matchId=m.id;

  // top row: time + competition emblem
  const top=document.createElement('div');top.className='mc-top';
  const timeSpan=document.createElement('span');timeSpan.className='mc-time';
  if(live){timeSpan.innerHTML='<span class="mc-live-pulse"></span> LIVE NOW';}
  else if(done){timeSpan.textContent='FULL TIME';}
  else{timeSpan.textContent=(isToday?'Today':'Tomorrow')+' · '+fmtTime(m.utcDate);}
  top.appendChild(timeSpan);
  if(m.competition?.emblem){
    const emb=document.createElement('img');emb.className='mc-comp-emblem';emb.src=m.competition.emblem;emb.alt='';emb.onerror=()=>emb.style.display='none';
    top.appendChild(emb);
  }
  card.appendChild(top);

  // teams row
  const teams=document.createElement('div');teams.className='mc-teams';
  const t1=document.createElement('div');t1.className='mc-team';
  t1.appendChild(teamEl(m.homeTeam,28));
  t1.innerHTML+=`<span class="mc-team-name">${m.homeTeam?.shortName||m.homeTeam?.name||'TBD'}</span>`;
  const mid=document.createElement('div');mid.className='mc-center';
  mid.innerHTML=(live||done)&&sh!=null?`<span class="mc-score">${sh} – ${sa}</span>`:'<span class="mc-vs">vs</span>';
  const t2=document.createElement('div');t2.className='mc-team';
  t2.appendChild(teamEl(m.awayTeam,28));
  t2.innerHTML+=`<span class="mc-team-name">${m.awayTeam?.shortName||m.awayTeam?.name||'TBD'}</span>`;
  teams.appendChild(t1);teams.appendChild(mid);teams.appendChild(t2);
  card.appendChild(teams);

  // countdown (within 5h)
  if(soon){
    const cd=document.createElement('div');cd.className='mc-countdown';cd.id='cd_'+m.id;
    cd.innerHTML=`<div class="cd-block"><span class="cd-num" id="cdh_${m.id}">00</span><span class="cd-lbl">H</span></div><span class="cd-sep">:</span><div class="cd-block"><span class="cd-num" id="cdm_${m.id}">00</span><span class="cd-lbl">M</span></div><span class="cd-sep">:</span><div class="cd-block"><span class="cd-num" id="cds_${m.id}">00</span><span class="cd-lbl">S</span></div>`;
    card.appendChild(cd);
    function tick(){const p=cdParts(m.utcDate);const he=document.getElementById('cdh_'+m.id),me=document.getElementById('cdm_'+m.id),se=document.getElementById('cds_'+m.id);if(he)he.textContent=p.h;if(me)me.textContent=p.m;if(se)se.textContent=p.s;if(new Date(m.utcDate)<=Date.now()){clearInterval(cdTimers[m.id]);loadMatches();}}
    tick();cdTimers[m.id]=setInterval(tick,1000);
  }

  // bottom row: competition name + tag
  const foot=document.createElement('div');foot.className='mc-bottom';
  foot.innerHTML=`<span class="mc-comp-name">${m.competition?.name||''}</span>`;
  const tag=document.createElement('span');
  if(live){tag.className='mc-tag mc-tag-live';tag.textContent='● LIVE';}
  else if(done){tag.className='mc-tag mc-tag-fin';tag.textContent='FT';}
  else if(soon){tag.className='mc-tag mc-tag-soon';tag.textContent='SOON';}
  else{tag.className='mc-tag mc-tag-up';tag.textContent=isToday?'TODAY':'TOMORROW';}
  foot.appendChild(tag);
  card.appendChild(foot);

  // hover hint
  if(!done){
    const hint=document.createElement('div');hint.className='mc-hint';
    hint.textContent=isToday?'▶ Tap to watch live':'🔔 Tap for details';
    card.appendChild(hint);
  }

  // click behaviour
  card.onclick=()=>{if(isToday&&!done)openPlayer(T_SPORTS);else if(!isToday)openSchedule(m);};
  return card;
}

function skelMatches(){
  const el=document.getElementById('mscroll');el.innerHTML='';
  for(let i=0;i<3;i++){
    const d=document.createElement('div');
    d.className='mc';d.style.cursor='default';d.style.opacity='.3';d.style.animation='none';
    d.innerHTML=`<div style="height:9px;width:80px;background:rgba(255,255,255,.08);border-radius:4px;margin-bottom:12px"></div><div style="height:50px;background:rgba(255,255,255,.05);border-radius:8px;margin-bottom:10px"></div><div style="height:8px;width:110px;background:rgba(255,255,255,.08);border-radius:4px"></div>`;
    el.appendChild(d);
  }
}

// ── Load matches from API (with fallback to direct API call)
async function loadMatches(){
  Object.values(cdTimers).forEach(clearInterval);
  skelMatches();
  const today=new Date().toISOString().split('T')[0];
  const tomorrow=new Date(Date.now()+86400000).toISOString().split('T')[0];
  const dayAfter=new Date(Date.now()+172800000).toISOString().split('T')[0];

  async function fetchM(type){
    const fdUrl=type==='today'?`https://api.football-data.org/v4/matches?dateFrom=${today}&dateTo=${today}`:`https://api.football-data.org/v4/matches?dateFrom=${tomorrow}&dateTo=${dayAfter}`;
    let sawRateLimit=false;

    // Step 1: Vercel serverless proxy (if deployed there) — preferred, keeps token server-side
    try{
      const r=await fetch('/api/matches?type='+type);
      if(r.status===429) sawRateLimit=true;
      if(r.ok){const d=await r.json();if(d.matches)return d.matches;}
    }catch(e){}

    // Step 2: Direct call — works if the host allows the X-Auth-Token CORS header
    try{
      const r=await fetch(fdUrl,{headers:{'X-Auth-Token':API_KEY}});
      if(r.status===429) sawRateLimit=true;
      if(r.ok){const d=await r.json();return d.matches||[];}
    }catch(e){}

    // Step 3: corsproxy.io — forwards custom headers including X-Auth-Token
    try{
      const proxied = 'https://corsproxy.io/?url=' + encodeURIComponent(fdUrl);
      const r=await fetch(proxied,{headers:{'X-Auth-Token':API_KEY}});
      if(r.status===429) sawRateLimit=true;
      if(r.ok){const d=await r.json();if(d.matches)return d.matches;}
    }catch(e){}

    // Step 4: codetabs proxy — alternate relay, forwards headers
    try{
      const proxied2 = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(fdUrl);
      const r=await fetch(proxied2,{headers:{'X-Auth-Token':API_KEY}});
      if(r.status===429) sawRateLimit=true;
      if(r.ok){const d=await r.json();if(d.matches)return d.matches;}
    }catch(e){}

    if(sawRateLimit) window.__ngtvRateLimited = true;
    return null;
  }

  try{
    const[d1,d2]=await Promise.all([fetchM('today'),fetchM('upcoming')]);
    const el=document.getElementById('mscroll');el.innerHTML='';
    const tL=(d1||[]).slice(0,8),uL=(d2||[]).slice(0,6);
    if(!tL.length&&!uL.length){
      if(window.__ngtvRateLimited){
        el.innerHTML='<div class="mc-empty"><span class="mc-empty-icon">⏳</span><span class="mc-empty-text">API limit reached — retrying shortly...</span></div>';
      }else{
        el.innerHTML='<div class="mc-empty"><span class="mc-empty-icon">⚽</span><span class="mc-empty-text">No matches scheduled</span></div>';
      }
      return;
    }
    window.__ngtvRateLimited = false;
    tL.forEach((m,i)=>el.appendChild(buildMatchCard(m,true,i)));
    uL.forEach((m,i)=>el.appendChild(buildMatchCard(m,false,tL.length+i)));
  }catch(e){
    document.getElementById('mscroll').innerHTML='<div class="mc-empty"><span class="mc-empty-icon">⚠</span><span class="mc-empty-text">Could not load match data</span></div>';
  }
}

    else d.innerHTML=`<span class="st-flag">${FLAG(t?.tla||'')}</span>`;

  const cdRow=document.createElement('div');cdRow.className='sched-cd';body.appendChild(cdRow);
  function renderCd(){const p=cdParts(m.utcDate);cdRow.innerHTML=`<div class="scd-block"><div class="scd-num">${p.h}</div><div class="scd-lbl">Hours</div></div><div class="scd-block"><div class="scd-num">${p.m}</div><div class="scd-lbl">Minutes</div></div><div class="scd-block"><div class="scd-num">${p.s}</div><div class="scd-lbl">Seconds</div></div>`;}
  renderCd();
  const st=setInterval(()=>{
    if(!document.getElementById('scheduleScreen').classList.contains('active')){clearInterval(st);return;}

    if(new Date(m.utcDate)<=Date.now()){clearInterval(st);loadMatches();}

  const info=document.createElement('div');info.className='sched-info';
  info.innerHTML=`<div class="si-row"><span class="si-icon">🏆</span><span class="si-text">Competition</span><span class="si-val">${m.competition?.name||'—'}</span></div><div class="si-row"><span class="si-icon">🏟️</span><span class="si-text">Venue</span><span class="si-val">${m.venue||'TBD'}</span></div><div class="si-row"><span class="si-icon">📅</span><span class="si-text">Matchday</span><span class="si-val">${m.matchday?'Matchday '+m.matchday:'—'}</span></div><div class="si-row"><span class="si-icon">📺</span><span class="si-text">Channel</span><span class="si-val">T Sports HD</span></div>`;
  body.appendChild(info);

  const rb=document.createElement('button');rb.className='remind-btn';rb.innerHTML='🔔 Set Reminder';
  rb.onclick=()=>{rb.innerHTML='✅ Reminder Set';rb.classList.add('set');showToast('🔔 We will notify you before the match');};
  body.appendChild(rb);

  document.getElementById('homeScreen').classList.remove('active');
  document.getElementById('scheduleScreen').classList.add('active');
  sessionStorage.setItem('ngtv_screen','schedule');
  safePush({screen:'schedule'},'#schedule');
}

  cbar.appendChild(b);
});

function mkLogo(url,cls,icon){
  // cls: 'grid'->channel card, 'un'->up-next strip, 'pb'->player bottom
  const iconCls = cls==='un' ? 'un-icon' : (cls==='pb' ? 'pb-icon' : 'ch-card-icon');
  const imgCls = cls==='un' ? 'un-logo' : (cls==='pb' ? 'pb-logo' : '');
  if(url){
    const i=document.createElement('img');i.src=url;if(imgCls)i.className=imgCls;i.alt='';
    i.onerror=()=>{
      i.style.display='none';
      if(icon){const s=document.createElement('span');s.className=iconCls;s.textContent=icon;i.parentNode&&i.parentNode.appendChild(s);}
    };
    return i;
  }
  const s=document.createElement('span');s.className=iconCls;s.textContent=icon||'📺';return s;
}

function renderGrid(){
  const g=document.getElementById('cgrid');g.innerHTML='';
  const list=activeCat==='All'?CH:CH.filter(c=>c.cat===activeCat);
  list.forEach(ch=>{
    const card=document.createElement('div');card.className='ch-card';
    const lw=document.createElement('div');lw.className='ch-card-logo';
    const catIcon=CAT_ICONS[ch.cat]||'📺';
    lw.appendChild(mkLogo(ch.logoUrl,'grid',catIcon));
    const dot=document.createElement('div');dot.className='ch-card-dot';lw.appendChild(dot);
    card.appendChild(lw);
    card.innerHTML+=`<div class="ch-card-name">${ch.name}</div><div class="ch-card-q">${ch.q}</div>`;
    card.onclick=()=>openPlayer(ch);
    g.appendChild(card);
  });
}
renderGrid();

//  Player Screen
// ══════════════════════════════════════════
let curCh=null,hls=null,retryCount=0;
const vid=document.getElementById('vid');
const loadOv=document.getElementById('loadOv');
const errOv=document.getElementById('errOv');
const bgc=document.getElementById('bgc');
const bgCtx=bgc?bgc.getContext('2d'):null;
let bgRaf=null;

function openPlayer(ch, skipHistory){
  curCh=ch;retryCount=0;
  document.getElementById('homeScreen').classList.remove('active');
  document.getElementById('scheduleScreen').classList.remove('active');
  document.getElementById('playerScreen').classList.add('active');

  // Save state for refresh persistence
  sessionStorage.setItem('ngtv_screen','player');
  sessionStorage.setItem('ngtv_channel_id', ch.id);
  if(!skipHistory){
    if(location.hash==='#player'){
      // Already on player screen (switching channel) — replace, don't stack
      safeReplace({screen:'player', chId:ch.id}, '#player');
    }else{
      // Coming from home/schedule — push a new entry
      safePush({screen:'player', chId:ch.id}, '#player');
    }
  }

  document.getElementById('pChName').textContent=ch.name;
  document.getElementById('pChSub').textContent=ch.cat+' · '+ch.q;
  document.getElementById('coName').textContent=ch.name;
  document.getElementById('pbName').textContent=ch.name;
  document.getElementById('pbMeta').textContent=ch.cat;
  document.getElementById('pbQ').textContent=ch.q;
  document.getElementById('loadChName').textContent=ch.name;

  const lw=document.getElementById('pbLw');lw.innerHTML='';
  const catIcon=CAT_ICONS[ch.cat]||'📺';
  lw.appendChild(mkLogo(ch.logoUrl,'pb',catIcon));

  // ── Up Next: same-name channels first (duplicate streams), then same category, then others
  const un=document.getElementById('unScroll');un.innerHTML='';
  const baseName = ch.name.replace(/\s*(HD|FHD|720p|1080p|#\d+|OP\d+)\s*$/i,'').trim().toLowerCase();
  const sameName = CH.filter(c=>c.id!==ch.id && baseName.length>2 && c.name.toLowerCase().includes(baseName));
  const sameCat = CH.filter(c=>c.id!==ch.id && c.cat===ch.cat && !sameName.includes(c));
  const others = CH.filter(c=>c.id!==ch.id && c.cat!==ch.cat && !sameName.includes(c));
  const upNextList = [...sameName, ...sameCat, ...others].slice(0,15);

  const unLbl = document.getElementById('unLbl');
  unLbl.textContent = sameName.length ? `Same Channel (${sameName.length+1})` : 'Same Category';

  upNextList.forEach((c,i)=>{
    const d=document.createElement('div');d.className='un-card'+(c.id===ch.id?' on':'');
    d.style.animationDelay=(i*0.03)+'s';
    const ulw=document.createElement('div');ulw.className='un-lw';
    ulw.appendChild(mkLogo(c.logoUrl,'un',CAT_ICONS[c.cat]||'📺'));
    d.appendChild(ulw);d.innerHTML+=`<div class="un-name">${c.name}</div>`;
    d.onclick=()=>openPlayer(c);un.appendChild(d);
  });

  // ── Channel grid below (with category tabs)
  renderPlayerGrid(ch);

  loadStream(ch);
}

// ══════════════════════════════════════════
//  HLS Stream Loading — smooth, auto-retry
// ══════════════════════════════════════════
// Rewrite http:// stream URLs to an https proxy when the page itself is https
// (browsers block mixed-content media loads, causing "valid link but nothing plays")
function proxifyStreamUrl(url){
  if(location.protocol==='https:' && url.startsWith('http://')){
    return 'https://corsproxy.io/?url=' + encodeURIComponent(url);
  }
  return url;
}

function loadStream(ch){
  loadOv.classList.remove('hidden');errOv.style.display='none';stopBg();resetFitMode();
  document.getElementById('loadChName').textContent=ch.name;
  if(hls){if(hls._ngtvWatchdog)clearInterval(hls._ngtvWatchdog);if(hls._ngtvLoadTimeout)clearTimeout(hls._ngtvLoadTimeout);hls.destroy();hls=null;}
  vid.src='';vid.removeAttribute('src');vid.load();

  const origUrl=ch.url;
  const url=proxifyStreamUrl(origUrl);
  const isTS=/\.ts(\?|$)/i.test(origUrl);
  const isMP4=/\.mp4(\?|$)/i.test(origUrl);
  const isMixedContent = location.protocol==='https:' && origUrl.startsWith('http://');

  // Mixed-content streams are auto-routed through an https proxy above (proxifyStreamUrl).
  // Show a subtle hint the first time so users understand any extra load delay.
  if(isMixedContent){
    showToast('🔄 Routing http stream through secure proxy...');
  }

  if(isMP4||isTS){
    let triedOriginal=false;
    vid.src=url;
    vid.oncanplay=()=>{vid.play().catch(()=>{});loadOv.classList.add('hidden');showToast('▶  '+ch.name);};
    vid.onerror=()=>{
      // If the proxied URL failed and we haven't tried the original yet, try it directly
      // (some browsers allow http:// <video src> on https pages even though XHR/fetch is blocked)
      if(isMixedContent && !triedOriginal){
        triedOriginal=true;
        vid.src=origUrl;
        vid.load();
        return;
      }
      loadOv.classList.add('hidden');
      errOv.style.display='flex';
      document.getElementById('errTxt').textContent = isMixedContent
        ? 'Blocked: http:// stream on https page'
        : 'Stream failed to load';
    };
    return;
  }

  if(Hls.isSupported()){
    hls=new Hls({
      enableWorker:true,
      lowLatencyMode:true,

      // Generous buffers for smooth 1080p playback
      maxBufferLength:40,
      maxMaxBufferLength:90,
      maxBufferSize:90*1000*1000,
      backBufferLength:30,
      maxBufferHole:0.6,
      highBufferWatchdogPeriod:3,

      // Stall recovery
      nudgeOffset:0.15,
      nudgeMaxRetry:6,
      maxStarvationDelay:6,
      maxLoadingDelay:6,

      // Network retries with backoff
      fragLoadingTimeOut:25000,
      fragLoadingMaxRetry:8,
      fragLoadingRetryDelay:600,
      fragLoadingMaxRetryTimeout:64000,
      manifestLoadingTimeOut:20000,
      manifestLoadingMaxRetry:6,
      manifestLoadingRetryDelay:600,
      manifestLoadingMaxRetryTimeout:64000,
      levelLoadingTimeOut:20000,
      levelLoadingMaxRetry:6,
      levelLoadingRetryDelay:600,

      // Quality / ABR
      startLevel:-1,
      abrEwmaDefaultEstimate:1500000,
      abrEwmaFastLive:3.0,
      abrEwmaSlowLive:9.0,
      abrBandWidthFactor:0.9,
      abrBandWidthUpFactor:0.7,
      startFragPrefetch:true,
      testBandwidth:true,
      capLevelToPlayerSize:false,

      // Some CDNs need explicit timeout + no-credentials to avoid CORS preflight failures
      xhrSetup:function(xhr){
        try{ xhr.timeout = 20000; }catch(e){}
      },
    });

    let stallRecoverAttempts=0;
    let lastLevelSwitchDown=0;

    hls.loadSource(url);
    hls.attachMedia(vid);

    hls.on(Hls.Events.MANIFEST_PARSED,(_,data)=>{
      vid.play().catch(()=>{});
      loadOv.classList.add('hidden');
      clearTimeout(hls._ngtvLoadTimeout);
      showToast('▶  '+ch.name+(data.levels&&data.levels.length>1?' · '+data.levels.length+' qualities':''));
    });

    // Overall load timeout — if manifest never parses within 22s, surface error with retry
    // (catches silently-hanging streams that don't fire a fatal HLS error)
    hls._ngtvLoadTimeout = setTimeout(()=>{
      if(loadOv && !loadOv.classList.contains('hidden')){
        loadOv.classList.add('hidden');
        errOv.style.display='flex';
        document.getElementById('errTxt').textContent='Stream is taking too long to start';
      }
    }, 22000);

    // Track playback progress for stall detection
    hls.on(Hls.Events.FRAG_BUFFERED, ()=>{ stallRecoverAttempts=0; });

    hls.on(Hls.Events.ERROR,(_,d)=>{
      const type = d.type;
      const details = d.details;

      if(!d.fatal){
        // Non-fatal: buffer stalls, fragment load errors on individual segments — try a gentle nudge
        if(details==='bufferStalledError' || details==='bufferSeekOverHole'){
          if(vid.buffered.length){
            try{ vid.currentTime += 0.1; }catch(e){}
          }
        }
        return;
      }

      // Fatal errors
      clearTimeout(hls._ngtvLoadTimeout);

      if(details==='manifestParsingError' && retryCount<1){
        // Non-standard manifest HLS.js couldn't parse — try native <video> tag instead
        retryCount++;
        hls.destroy();hls=null;
        vid.src=url;
        vid.oncanplay=()=>{vid.play().catch(()=>{});loadOv.classList.add('hidden');showToast('▶  '+ch.name);};
        vid.onerror=()=>{loadOv.classList.add('hidden');errOv.style.display='flex';document.getElementById('errTxt').textContent='Stream format not supported';};
        return;
      }

      if(type===Hls.ErrorTypes.NETWORK_ERROR){
        if(details==='manifestLoadError' || details==='manifestLoadTimeOut'){
          // Likely CORS/host-block — give one retry then show clear message
          if(retryCount<2){
            retryCount++;
            setTimeout(()=>{if(hls)hls.loadSource(url);},1200*retryCount);
          }else{
            loadOv.classList.add('hidden');
            errOv.style.display='flex';
            document.getElementById('errTxt').textContent='Stream unreachable (CORS or host blocked)';
          }
        }else if(retryCount<4){
          retryCount++;
          setTimeout(()=>{if(hls)hls.startLoad();},1000*retryCount);
        }else{
          loadOv.classList.add('hidden');
          errOv.style.display='flex';
          document.getElementById('errTxt').textContent='Network error — stream unavailable';
        }
      }else if(type===Hls.ErrorTypes.MEDIA_ERROR){
        stallRecoverAttempts++;
        if(stallRecoverAttempts<=3){
          // Try progressively stronger recovery
          if(stallRecoverAttempts===1){
            hls.recoverMediaError();
          }else if(stallRecoverAttempts===2){
            // Step down a quality level — high bitrate may be too heavy for this device/network
            const cur = hls.currentLevel;
            if(cur>0){ hls.currentLevel = cur-1; lastLevelSwitchDown=Date.now(); }
            hls.recoverMediaError();
          }else{
            // Last resort: full reload of source
            hls.destroy();
            hls=null;
            setTimeout(()=>loadStream(ch),400);
          }
        }else{
          loadOv.classList.add('hidden');
          errOv.style.display='flex';
          document.getElementById('errTxt').textContent='Playback error — try a different channel';
        }
      }else{
        // Other fatal (e.g. mux errors)
        loadOv.classList.add('hidden');
        errOv.style.display='flex';
        document.getElementById('errTxt').textContent='Stream failed to load';
      }
    });

    // Gentle stall watchdog: only nudge if truly stuck (avoid CPU-spin loops)
    let lastTime=-1, stuckTicks=0;
    const watchdog=setInterval(()=>{
      if(!hls || vid.paused || vid.ended){ stuckTicks=0; return; }
      if(vid.currentTime===lastTime){
        stuckTicks++;
        if(stuckTicks===3){ // ~6s stuck
          try{ hls.startLoad(); }catch(e){}
        }
        if(stuckTicks>=6){ // ~12s stuck — nudge time forward slightly
          try{ vid.currentTime += 0.3; }catch(e){}
          stuckTicks=0;
        }
      }else{
        stuckTicks=0;
      }
      lastTime=vid.currentTime;
    },2000);
    vid.addEventListener('ended',()=>clearInterval(watchdog));
    hls._ngtvWatchdog=watchdog;

  }else if(vid.canPlayType('application/vnd.apple.mpegurl')){
    // Native HLS (Safari/iOS)
    vid.src=url;
    vid.oncanplay=()=>{vid.play().catch(()=>{});loadOv.classList.add('hidden');showToast('▶  '+ch.name);};
    vid.onerror=()=>{
      loadOv.classList.add('hidden');
      errOv.style.display='flex';
      document.getElementById('errTxt').textContent='Stream failed to load';
    };
  }else{
    loadOv.classList.add('hidden');
    errOv.style.display='flex';
    document.getElementById('errTxt').textContent='HLS not supported on this browser';
  }
}

function retryPlay(){retryCount=0;if(hls&&hls._ngtvLoadTimeout)clearTimeout(hls._ngtvLoadTimeout);if(curCh)loadStream(curCh);}

// ══════════════════════════════════════════
//  Navigation: Home / Back button
// ══════════════════════════════════════════
function goHome(fromPopstate){
  if(hls){if(hls._ngtvWatchdog)clearInterval(hls._ngtvWatchdog);if(hls._ngtvLoadTimeout)clearTimeout(hls._ngtvLoadTimeout);hls.destroy();hls=null;}
  vid.src='';vid.load();stopBg();
  document.getElementById('playerScreen').classList.remove('active');
  document.getElementById('scheduleScreen').classList.remove('active');
  document.getElementById('homeScreen').classList.add('active');
  sessionStorage.setItem('ngtv_screen','home');
  sessionStorage.removeItem('ngtv_channel_id');
  if(!fromPopstate){
    if(location.hash==='#player'||location.hash==='#schedule'){
      try{history.back();}catch(e){}
    }
  }
}

// ══════════════════════════════════════════
//  Player controls
// ══════════════════════════════════════════
let ctrlT=null;
function toggleCtrl(){const o=document.getElementById('ctrlOv');o.classList.toggle('show');clearTimeout(ctrlT);if(o.classList.contains('show'))ctrlT=setTimeout(()=>o.classList.remove('show'),3500);}
function togglePlay(){const b=document.getElementById('ppBtn');if(vid.paused){vid.play();b.textContent='⏸';}else{vid.pause();b.textContent='▶';}}
function seekBy(s){vid.currentTime+=s;}
function setVol(e){const r=e.currentTarget.getBoundingClientRect();const v=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));vid.volume=v;document.getElementById('volFill').style.width=(v*100)+'%';document.getElementById('volThumb').style.right=((1-v)*100)+'%';}

// ── Fit-to-screen mode toggle: Contain (default, nothing cropped) → Cover (fills screen) → Fill (stretch)
const FIT_MODES = [
  { cls: '',           label: 'FIT',  toast: 'Fit: showing full stream (no cropping)' },
  { cls: 'fit-cover',  label: 'FILL', toast: 'Fill: scaled to fill screen (edges may crop)' },
  { cls: 'fit-fill',   label: 'STRETCH', toast: 'Stretch: video stretched to fit screen' },
];
let fitModeIndex = 0;
function applyFitMode(){
  vid.classList.remove('fit-cover','fit-fill');
  const mode = FIT_MODES[fitModeIndex];
  if(mode.cls) vid.classList.add(mode.cls);
  const btn = document.getElementById('fitBtn');
  if(btn){
    btn.textContent = mode.label;
    btn.classList.toggle('active', fitModeIndex !== 0);
  }
  // Blurred backdrop only makes sense in "Contain" mode (letterbox bars visible)
  if(bgc) bgc.style.display = (fitModeIndex === 0) ? '' : 'none';
}
function cycleFit(){
  fitModeIndex = (fitModeIndex + 1) % FIT_MODES.length;
  applyFitMode();
  showToast(FIT_MODES[fitModeIndex].toast);
}
function resetFitMode(){
  fitModeIndex = 0;
  applyFitMode();
}

// ── Fullscreen + landscape rotate
// ══════════════════════════════════════════
//  Fullscreen + Rotate — CSS-based rotation
//  Rotates ONLY the video player box to landscape,
//  works even where screen.orientation.lock is unsupported (iOS Safari)
// ══════════════════════════════════════════
function isPortrait(){
  return window.innerHeight > window.innerWidth;
}

function goFS(){
  const b=document.getElementById('vbox');
  const isRotated = b.classList.contains('rotated-fs');
  const isNativeFS = document.fullscreenElement || document.webkitFullscreenElement;

  if(!isRotated && !isNativeFS){
    // ── ENTER fullscreen ──
    const req = b.requestFullscreen||b.webkitRequestFullscreen||b.mozRequestFullScreen||b.msRequestFullscreen;
    const tryOrientationLock = ()=>{
      if(screen.orientation && screen.orientation.lock){
        return screen.orientation.lock('landscape').then(()=>true).catch(()=>false);
      }
      return Promise.resolve(false);
    };

    if(req){
      req.call(b).then(()=>{
        tryOrientationLock().then((locked)=>{
          // If orientation lock failed (iOS Safari etc.) and we're in portrait,
          // rotate the player box itself via CSS so video appears landscape.
          if(!locked && isPortrait()){
            b.classList.add('rotated-fs');
            document.getElementById('fsExitBtn').classList.add('show');
          }
        });
      }).catch(()=>{
        // Native fullscreen unavailable — fall back to CSS rotation directly
        if(isPortrait()){
          b.classList.add('rotated-fs');
          document.getElementById('fsExitBtn').classList.add('show');
        }
      });
    }else if(isPortrait()){
      b.classList.add('rotated-fs');
      document.getElementById('fsExitBtn').classList.add('show');
    }
  }else{
    // ── EXIT fullscreen ──
    exitPlayerFullscreen();
  }
}

function exitPlayerFullscreen(){
  const b=document.getElementById('vbox');
  b.classList.remove('rotated-fs');
  document.getElementById('fsExitBtn').classList.remove('show');
  const exit = document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
  if(document.fullscreenElement||document.webkitFullscreenElement){ if(exit) exit.call(document); }
  if(screen.orientation && screen.orientation.unlock){
    try{screen.orientation.unlock();}catch(e){}
  }
}

document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement){
    const b=document.getElementById('vbox');
    b.classList.remove('rotated-fs');
    document.getElementById('fsExitBtn').classList.remove('show');
    if(screen.orientation && screen.orientation.unlock){
      try{screen.orientation.unlock();}catch(e){}
    }
  }
});
document.addEventListener('webkitfullscreenchange', ()=>{
  if(!document.webkitFullscreenElement){
    const b=document.getElementById('vbox');
    b.classList.remove('rotated-fs');
    document.getElementById('fsExitBtn').classList.remove('show');
  }
});

// If the device physically rotates to landscape while CSS-rotated fullscreen is active,
// drop the artificial rotation since the device orientation now matches.
window.addEventListener('resize', ()=>{
  const b=document.getElementById('vbox');
  if(b.classList.contains('rotated-fs') && !isPortrait()){
    b.classList.remove('rotated-fs');
    document.getElementById('fsExitBtn').classList.remove('show');
  }
});

// ── Blur background canvas (fills letterbox bars with blurred video)
function startBg(){if(!bgCtx)return;cancelAnimationFrame(bgRaf);(function draw(){if(vid.readyState>=2&&!vid.paused&&!vid.ended){bgc.width=bgc.offsetWidth||320;bgc.height=bgc.offsetHeight||240;bgCtx.drawImage(vid,0,0,bgc.width,bgc.height);}bgRaf=requestAnimationFrame(draw);})();}
function stopBg(){cancelAnimationFrame(bgRaf);if(bgCtx&&bgc)bgCtx.clearRect(0,0,bgc.width,bgc.height);}
vid.addEventListener('play',startBg);
vid.addEventListener('pause',stopBg);
vid.addEventListener('ended',stopBg);

// ══════════════════════════════════════════
//  Toast
// ══════════════════════════════════════════
let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2500);}

// ══════════════════════════════════════════
//  Mobile back button + refresh persistence
// ══════════════════════════════════════════
window.addEventListener('popstate', (e)=>{
  const screen = e.state?.screen;
  if(screen==='player' && e.state.chId){
    const ch = CH.find(c=>c.id===e.state.chId);
    if(ch) openPlayer(ch, true);
  } else {
    goHome(true);
  }
});

(function restoreState(){
  const screen = sessionStorage.getItem('ngtv_screen');
  const chId = parseInt(sessionStorage.getItem('ngtv_channel_id'));
  if(screen==='player' && chId){
    const ch = CH.find(c=>c.id===chId);
    if(ch){
      safeReplace({screen:'player',chId:ch.id}, '#player');
      openPlayer(ch, true);
    }
  } else {
    if(!history.state) safeReplace({screen:'home'}, location.pathname);
  }
})();
